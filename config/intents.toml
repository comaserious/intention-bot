[[intent]]
name = "정착지원"
definition = "경상북도로 이주·전입했거나 하려는 사람이 정착하는 데 필요한 지원. 정주여건 지역 비교, 이사할 지역 추천, 전입 인센티브·정착지원금·월세 지원, 전입 지원정책과 신청 절차."

[[intent]]
name = "생활지원"
definition = "경북 도민의 일상 생활 안정을 위한 복지·돌봄·주거 지원. 기초연금, 노인복지·노인맞춤돌봄, 아이돌봄, 주거복지의 안내와 자격 확인, 신청 서류."

[[intent]]
name = "소상공인지원"
definition = "소상공인·예비창업자를 위한 지원. 창업 방법, 정책자금(금리·이차보전), 청년 창업 지원사업, 업종·매출 기반 지원사업 추천과 신청 준비."

[[intent]]
name = "공장설립지원"
definition = "공장 설립을 준비하는 기업·수요자를 위한 지원. 설립 조건, 입지 규제와 용도지역 검토, 계획입지/개별입지, 배출시설 등 인허가 절차, 공장설립 AI 사전진단."
